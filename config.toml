# Конфигурация валидационного кейса трека 2 («Кейс_для_участников_хакатона_трека№2»).
#
# Объект тот же — Модель Z. Меняются УСЛОВИЯ задачи, поэтому здесь нет ни строки
# кода и ни одной правки модулей: все ограничения кейса выражены ключами, которые
# в `config.toml` стояли закомментированными как «придут с кейсом». Это и есть
# проверка переносимости, заявленная в ТЗ.
#
# Источник каждого числа — текст кейса, раздел «технологические условия».

[case]
model_dir = "vendor/Model_Z_OPM"
run_dir = "runs/case2007"
case_name = "RUN"

# «История разработки и базовое управление фондом до 31.12.2006 включительно.
# Начиная с 01.01.2007 ... стратегию формирует система.»
control_start = 2007-01-01

[economics]
# Горизонт кейса — 01.01.2007 … 01.09.2025, он же период управления. ЧДД
# считается за период управления (письмо организаторов 08.09), поэтому база
# дисконта совпадает с началом управления.
start_date = 2007-01-01
norms_file = "vendor/CHDD_PYTHON/input/Нормативы_ЧДД.xlsx"

[fluids]
oil_density = 913.0765883224138
water_density = 1172.0

[limits]
# «Инфраструктурное ограничение товарных парков — добыча жидкости не более
# 600 м³/сут ... в любой момент времени на протяжении всего горизонта расчёта».
max_field_liquid_m3_per_day = 600

# «Месторождению может быть выделено не более 600 м³/сут воды для закачки ...
# Суммарная закачка не должна превышать 600 м³/сут в любой момент времени.»
max_field_injection_m3_per_day = 600

# Ключевое слово кейса — «в любой момент времени». Значит предел применяется к
# КАЖДОМУ месяцу, а не к среднесуточному за год: годовое усреднение разрешило бы
# пик 900 м³/сут в июле, компенсированный простоем в декабре, и формально прошло
# бы проверку. False — это и есть строгое прочтение.
field_limits_are_annual_average = false

# «Коэффициент компенсации отбора закачкой должен преимущественно находиться в
# диапазоне 0,85–1,15. Для оценки используется скользящее среднее за три месяца.»
enforce_water_balance = true
water_balance_rule = "compensation"
water_tolerance = 1.15
water_tolerance_min = 0.85
compensation_window_months = 3

# «Среднее пластовое давление должно поддерживаться не ниже 108 атм.»
# Пластовое расписанием не задаётся — это отклик пласта, поэтому ограничение
# работает проверкой по факту выгрузки (`sanity_problems`), а не срезкой.
min_reservoir_pressure_atm = 108

# «Для добывающих скважин минимально допустимое забойное давление — 50 атм,
# для нагнетательных максимальное забойное давление — 300 атм.»
min_producer_bhp_atm = 50
max_injector_bhp_atm = 300

# Мощность стороннего водоисточника больше не «неизвестна»: кейс назвал её прямо
# — выделяется не более 600 м³/сут на закачку, и дополнительной воды в 2007–2025
# получить нельзя. Это предел на всю закачку (выше), а не на приток со стороны,
# поэтому отдельное правило external_water не включаем: иначе одно и то же
# ограничение считалось бы дважды и резало бы фонд вдвое.
max_external_water_m3_per_day = 0

# --- обязательные ремонты (система предиктивной диагностики) -------------------
#
# «Эти события считаются известными заранее и обязательными. Изменить дату или
# продолжительность ремонта агент не может.» Имена скважин в деке — голые номера
# ('90', '27', ...), так что номера кейса ложатся один в один.
#
# Огрубление названо явно: шаг расписания — месяц, а окна кейса заканчиваются
# первым числом («по 01.06.2007»). `ShutWindow.covers` закрывает месяц целиком,
# то есть июнь 2007 у скв. 90 стоит полностью. Выбор в пользу более длинной
# остановки сделан сознательно: нарушить обязательное условие дороже, чем
# потерять месяц добычи.
#
# Разделения «остановка добычи» / «остановка закачки» в форме ограничения не
# требуется: скважина кейса либо добывающая, либо нагнетательная, и в обоих
# случаях остановка — это отсутствие режима у этой скважины в эти месяцы.

# --- необязательные ручки под валидационный кейс ------------------------------
#
# Ниже перечислены ключи, которых в этом файле нет намеренно: на Модели Z ни один
# из них не нужен, а включённый по умолчанию любой из них изменил бы заявляемое
# число. Кейс организаторов придёт со своими ограничениями («по давлениям, по
# фонду, по закачке»), и тогда нужный ключ дописывается сюда — без правки кода.
# Формы, которые мы не выражаем вовсе, перечислены в `docs/validation-case.md`,
# раздел 9; там же сказано, что про них писать в отчёт.
#
# Пределы и режимы:
#   min_producer_bhp_atm = 50            # иначе берётся из дека
#   max_injector_bhp_atm = 300
#   max_well_liquid_m3_per_day = 400     # потолок одной добывающей
#   max_well_injection_m3_per_day = 300  # потолок одной нагнетательной
#   max_field_liquid_m3_per_year = 4e6   # годовой объём отбора по объекту
#   max_field_liquid_m3_total = 6e7      # то же за весь горизонт разработки
#   max_field_injection_m3_total = 8e7
#   max_watercut = 0.95                  # предел обводнённости (проверка по выгрузке)
#   max_field_injection_m3_per_year = 6e6
#   max_field_oil_t_per_day = 1200       # мощность УПН: предел по нефти
#   max_field_water_t_per_day = 9000     # мощность УПСВ: предел по попутной воде
#   water_tolerance_min = 0.85           # нижняя граница коридора баланса воды
#   min_reservoir_pressure_atm = 50      # пластовое давление: проверка по факту
#   max_reservoir_pressure_atm = 300
#   field_limits_are_annual_average = true  # суточные пределы — среднее за год,
#                                           # а не пик каждого месяца
#
# Фонд и мероприятия:
#   controllable_wells = ["102", "305"]  # остальные остаются на историческом режиме
#   forced_shut_wells = ["417"]          # остановлены на весь горизонт
#   max_active_wells = 90
#   max_events_per_year = 12             # остановки, пуски, переводы под закачку
#   max_events_per_month = 3             # тот же счёт, но за календарный месяц
#   min_regime_months = 3                # режим скважины держится не меньше трёх месяцев
#   min_producer_rate_m3_per_day = 5     # ниже порога скважина не работает, а стоит
#
# Адресные потолки и группы:
#   [limits.well_caps_m3_per_day]
#   "102" = 250
#
#   [limits.well_groups]
#   "куст-1" = ["102", "305"]            # скважина может входить в несколько групп
#
#   [limits.group_liquid_caps_m3_per_day]
#   "куст-1" = 400
#
#   [limits.group_injection_caps_m3_per_day]
#   "куст-1" = 300
#
# Обязательные остановки с окном дат (окон у скважины может быть несколько):
#   [[limits.forced_shut_windows]]
#   well = "102"
#   start = 2027-01-01
#   end = 2027-06-30

[policy]
lookback_months = 6

[trust]
pairs_file = "docs/data/margin-pairs-search.csv"
pairs_family = "search"
search_seeds = [20260830, 20260831, 20260901, 20260902, 20260903, 20260904,
                20260905, 20260906, 20260907, 20260908]

[explain]
enabled = false
provider = "yandex"
folder_id = "b1gv1qukvdoctt94dgnu"
model = "yandexgpt/latest"
max_tokens = 1024
effort = "low"
cache_dir = "artifacts/explanations"

[run]
seed = 20260817
processes = 2

