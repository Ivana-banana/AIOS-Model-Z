# Конфигурация прогона. Регламент требует, чтобы результат воспроизводился из
# файла конфигурации, а не из памяти запускавшего. Всё, что влияет на число ЧДД,
# должно быть здесь; в коде значений по умолчанию для этих величин нет.

[case]
# Дек организаторов. Действующая поставка — OPM-совместимая, от 14.08.2026.
model_dir = "vendor/Model_Z_OPM"
run_dir = "runs/base"
case_name = "RUN"

# Начало управления фондом. Для трека 2 — 01.01.2007: так сказано в методике и так
# же начинает выгрузку экспортёр организаторов (USER/Model_Z/script_1.py).
control_start = 2007-01-01

[economics]
# Первый год дисконтирования. Совпадает с началом управления.
# Внимание: эталонный JSON организаторов посчитан от 1991 — расхождение в
# docs/decisions.md, вопрос В-01.
start_date = 2007-01-01
norms_file = "vendor/CHDD_PYTHON/input/Нормативы_ЧДД.xlsx"

[fluids]
# Поверхностные плотности из DENSITY дека, кг/м³. Первый PVT-регион.
# Во втором регионе нефть 928,16 — разница 1,6 %, и она идёт прямо в выручку.
oil_density = 913.0765883224138
water_density = 1172.0

[limits]
# Ограничения уровня объекта. В валидационном кейсе они придут от организаторов
# («по давлениям, по фонду, по закачке»), поэтому живут в конфигурации, а не в коде.

# Предел системы сбора по жидкости, м³/сут на весь объект. Ноль — предела нет.
# Пока ноль: своего значения у нас нет, а выдуманное исказит подбор режимов.
max_field_liquid_m3_per_day = 0

# Мощность КНС/водоводов по закачке, м³/сут на объект. Пока неизвестна; после
# ответа организаторов вместо нуля подставляется их число.
max_field_injection_m3_per_day = 0

# Ограничивать закачку балансом воды.
enforce_water_balance = true

# Мощность стороннего водоисточника, м³/сут. Ноль — величина неизвестна.
# Нужна только правилу external_water. Закачка Модели Z на 60,8 % за историю и на
# 682 м³/сут в 2024 состоит из воды со стороны (docs/manus/round4.md, Р-71);
# паспорта водозабора в поставке нет, поэтому ноль здесь — «не режем и говорим
# об этом в отчёте», а не «источника нет».
max_external_water_m3_per_day = 0

# Чем ограничена закачка. Ответ организаторов «дополнительной воды на объекте нет»
# (docs/method/qa-organisers.md) ограничивает ИСТОЧНИК, а не отношение объёмов:
# отраслевой нормы «закачка ≤ добытая вода» не существует, нормируются источник,
# качество и максимальный годовой объём (docs/manus/vrr-water-balance.md, Р-61).
# produced_water — буквальное прочтение, отвергает саму историю Модели Z (2,32);
# compensation — закачка возмещает отобранный пластовый объём, история даёт 1,291.
# external_water — закачка ≤ попутная вода + мощность стороннего источника;
# единственное из трёх правил, ограничивающее источник, а не отношение объёмов.
water_balance_rule = "compensation"

# Потолок правила. Для compensation 1.3 — не выше исторической компенсации
# объекта (1,291); для produced_water 1.0 означает «сколько подняли, столько и
# закачали».
water_tolerance = 1.3

[policy]
# Сколько убыточных месяцев подряд считать основанием для остановки скважины.
lookback_months = 6

[trust]
# Пары должны быть кандидатами того же поиска, к которому применяется запас.
pairs_file = "docs/data/margin-pairs-search.csv"
pairs_family = "search"
# Ночной набор: порядок координат поиска. Каждый seed даёт отдельный кандидат,
# который обязательно проходит полный ГГДМ-расчёт.
search_seeds = [20260830, 20260831, 20260901, 20260902, 20260903, 20260904]

[explain]
# Слой интерпретируемости. Требование ТЗ п. 3.1: языковая модель в ядре слоя.
# Модель формулирует объяснение, но не принимает решений и не производит чисел —
# все величины приходят из расчёта и проверяются в тексте (aios/explain.py).

# Выключен по умолчанию: проверяющий запускает пакет без наших учётных данных,
# и объяснения тогда идут по шаблону, а не роняют прогон.
enabled = false

# Поставщик модели: anthropic или yandex. Слой написан под контракт Anthropic,
# адаптер Яндекса живёт отдельно (aios/yandex.py) и зависимостей не добавляет.
provider = "yandex"

# Каталог Yandex Cloud. Не секрет — секрет только ключ, и он читается ИСКЛЮЧИТЕЛЬНО
# из переменной окружения YANDEX_API_KEY. В конфиге ключу места нет: конфиг едет
# в git, а ключ ехать туда не должен.
folder_id = "b1gv1qukvdoctt94dgnu"

# Имя модели. Для anthropic — claude-opus-5; для yandex — yandexgpt/latest либо
# готовый URI вида gpt://<каталог>/<модель>.
model = "yandexgpt/latest"
max_tokens = 1024

# Объяснение готового решения — не та задача, где нужна глубина рассуждения.
effort = "low"

# Детерминизма у вызова нет: на claude-opus-5 параметр temperature не
# принимается вовсе. Воспроизводимость даёт кэш — объяснение сохраняется по
# отпечатку набора фактов, и повторный прогон берёт готовый текст.
cache_dir = "artifacts/explanations"

[run]
# Любая случайность в проекте берётся отсюда: регламент прямо запрещает
# неконтролируемые случайные параметры.
seed = 20260817
processes = 2
