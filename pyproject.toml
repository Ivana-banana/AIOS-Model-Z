[project]
name = "aios-track2"
version = "0.1.0"
description = "МАС с суррогатными моделями для управления фондом скважин Модели Z (хакатон AIOS, трек 2)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/CHDD_PYTHON/tests"]
pythonpath = [".", "tests", "vendor/CHDD_PYTHON"]
addopts = "-q"
filterwarnings = [
    # resdata предупреждает о своих же векторах на каждом вызове — шум в выводе тестов
    "ignore::DeprecationWarning:resdata.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# Эталонный расчётчик организаторов вендорен как есть и под наш линтер не подгоняется.
# Скрипт выгрузки организаторов из тНавигатора хранится дословно как контракт:
# он исполняется в их окружении с глобалями тНавигатора и под наш линтер не подходит.
# «Scripts» в этом списке не пишем: под Windows он же означает наш scripts/, и тогда
# скрипты запуска молча перестают линтоваться (тем же способом они выпали из git).
# Скрипты из отчётов Manus (`docs/manus/*-calc.py`, `*-stats.py`) — тоже чужие артефакты:
# они приложены как есть, чтобы числа отчёта можно было пересчитать. Наш пересчёт
# рядом (`docs/manus/ppd-rescale.py`) под линтером остаётся.
extend-exclude = ["vendor", "Lib", "Include", "docs/method/organisers-export-script_1.py",
                  "docs/manus/ppd-capacity-calc.py", "docs/manus/uplift-benchmarks-stats.py",
                  "docs/manus/cyclic-schedules.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # длинные строки ловит formatter, а не линтер
]

[tool.ruff.lint.per-file-ignores]
# В тестах обращение к приватным константам разбора — осознанное: они и есть контракт.
"tests/*" = ["SLF001"]
