# Конфигурация прогона. Регламент требует, чтобы результат воспроизводился из
# файла конфигурации, а не из памяти запускавшего. Всё, что влияет на число ЧДД,
# должно быть здесь; в коде значений по умолчанию для этих величин нет.

[case]
# Дек организаторов. Действующая поставка — OPM-совместимая, от 14.08.2026.
model_dir = "vendor/Model_Z_OPM"
run_dir = "runs/base"
case_name = "RUN"

# Начало управления фондом. Для трека 2 — 01.01.2007: так сказано в методике и так
# же начинает выгрузку экспортёр организаторов (USER/Model_Z/script_1.py).
control_start = 2007-01-01

[economics]
# Начало экономического расчёта. У эталонного расчётчика это ОДИН параметр
# `--start-year`, и он делает две вещи сразу: строки раньше него не попадают в
# экономику (`chdd_model.compute_calculation`: `filtered_rows = [row for row in
# economic_rows if row["DATA"] >= calculation_start_date]`), а дисконт считается
# от него же. Отдельного «окна без дисконта» у методики нет, и заводить своё
# значило бы переписать методику — запрещено (`CLAUDE.md`).
#
# Значение равно `[case].control_start` по письму организаторов от 08.09.2026:
# «и файл управляющих последовательностей, и значение ЧДД — только за период,
# когда месторождением управляет AIOS, без исторической части». Раз число
# считают за период управления, параметр окна равен началу управления.
#
# Это отменяет прежнее значение 1991-01-01, стоявшее здесь с 02.09 по устному
# ответу трекера на вопрос 5 письма организаторам (Р-158): тот ответ давался про
# заявку, включавшую историю, а письмо 08.09 сменило саму форму сдачи. Обе
# величины и обе заявки посчитаны и подписаны — `docs/decisions.md`, Р-249;
# на том же файле база 1991 даёт 5 579,5, окно 2007 — 13 133,8 млн руб.
# Вопрос вынесен на КТ-3 11.09 (`docs/kt3-questions.md`).
#
# Величина НЕ меняет `wells_schedule.inc` и не меняет выбор сценария: переход
# базы с 1991 на 2007 умножает все годовые слагаемые на одну константу
# 1,1^16, то есть порядок сценариев по ЧДД сохраняется.
start_date = 2007-01-01
norms_file = "vendor/CHDD_PYTHON/input/Нормативы_ЧДД.xlsx"

[fluids]
# Поверхностные плотности из DENSITY дека, кг/м³. Первый PVT-регион.
# Во втором регионе нефть 928,16 — разница 1,6 %, и она идёт прямо в выручку.
oil_density = 913.0765883224138
water_density = 1172.0

[limits]
# Ограничения уровня объекта. В валидационном кейсе они придут от организаторов
# («по давлениям, по фонду, по закачке»), поэтому живут в конфигурации, а не в коде.

# Предел системы сбора по жидкости, м³/сут на весь объект. Ноль — предела нет.
# Пока ноль: своего значения у нас нет, а выдуманное исказит подбор режимов.
max_field_liquid_m3_per_day = 0

# Мощность КНС/водоводов по закачке, м³/сут на объект. Пока неизвестна; после
# ответа организаторов вместо нуля подставляется их число.
max_field_injection_m3_per_day = 0

# Пределы ПЛАСТОВОГО давления, атм: снизу у добывающих, сверху у нагнетательных.
# Не путать с забойным — оно уставка и уезжает в WCONPROD/WCONINJE (50 и 300 атм
# из дека). Пластовое (WBP9, колонка THP выгрузки) — отклик пласта: расписанием
# его не задать, поэтому предел работает проверкой по факту в sanity_problems,
# а не срезкой в планировщике.
#
# Ключи не заданы: своих чисел у нас нет, они придут с кейсом («по давлениям» —
# docs/method/qa-organisers.md). Замер на Модели Z от 01.09 говорит, где мы:
#   добывающие      min 32,1   p1 50,9   медиана 109,7 (база) / 117,4 (заявка)
#   нагнетательные  медиана 177,9 (база) / 200,2 (заявка), max 282,2 / 291,8
# То есть при верхней границе 300 атм заявка проходит с запасом 8,2 атм, но 17
# её строк уже выше 290, а у базы таких нет. Граница ниже 292 — заявка не проходит.
# min_reservoir_pressure_atm = 50.0
# max_reservoir_pressure_atm = 300.0

# Ограничивать закачку балансом воды.
enforce_water_balance = true

# Мощность стороннего водоисточника, м³/сут. Ноль — величина неизвестна.
# Нужна только правилу external_water. Закачка Модели Z на 60,8 % за историю и на
# 682 м³/сут в 2024 состоит из воды со стороны (docs/manus/round4.md, Р-71);
# паспорта водозабора в поставке нет, поэтому ноль здесь — «не режем и говорим
# об этом в отчёте», а не «источника нет».
max_external_water_m3_per_day = 0

# Чем ограничена закачка. Ответ организаторов «дополнительной воды на объекте нет»
# (docs/method/qa-organisers.md) ограничивает ИСТОЧНИК, а не отношение объёмов:
# отраслевой нормы «закачка ≤ добытая вода» не существует, нормируются источник,
# качество и максимальный годовой объём (docs/manus/vrr-water-balance.md, Р-61).
# produced_water — буквальное прочтение, отвергает саму историю Модели Z (2,32);
# compensation — закачка возмещает отобранный пластовый объём, история даёт 1,291.
# external_water — закачка ≤ попутная вода + мощность стороннего источника;
# единственное из трёх правил, ограничивающее источник, а не отношение объёмов.
water_balance_rule = "compensation"

# Верхняя граница правила. Для compensation 1.3 — не выше исторической
# компенсации объекта (1,291); для produced_water 1.0 означает «сколько подняли,
# столько и закачали».
water_tolerance = 1.3

# Нижняя граница того же отношения — вторая половина коридора. Ключ намеренно
# не задан: трекер на КТ-2 сказала, что коридор придёт с тестовым кейсом и будет
# «примерно 0.85–1.15 условно», но точных чисел не назвала
# (docs/kt2-feedback-2026-08-31.md). Выдуманная нижняя граница изменила бы
# заявляемое ЧДД на величину, которой никто не измерял, поэтому до кейса здесь
# ничего не стоит, а поведение остаётся односторонним, как и было.
# Когда числа придут — раскомментировать и поставить их:
# water_tolerance_min = 0.85
#
# Что важно знать заранее: историческая компенсация Модели Z — 1,291, то есть при
# коридоре 0.85–1.15 в него не попадает сама история объекта, а не только наша
# заявка. Проверено тестом test_the_historical_scenario_sits_above_a_085_115_corridor.

# --- необязательные ручки под валидационный кейс ------------------------------
#
# Ниже перечислены ключи, которых в этом файле нет намеренно: на Модели Z ни один
# из них не нужен, а включённый по умолчанию любой из них изменил бы заявляемое
# число. Кейс организаторов придёт со своими ограничениями («по давлениям, по
# фонду, по закачке»), и тогда нужный ключ дописывается сюда — без правки кода.
# Формы, которые мы не выражаем вовсе, перечислены в `docs/validation-case.md`,
# раздел 9; там же сказано, что про них писать в отчёт.
#
# Пределы и режимы:
#   min_producer_bhp_atm = 50            # иначе берётся из дека
#   max_injector_bhp_atm = 300
#   max_well_liquid_m3_per_day = 400     # потолок одной добывающей
#   max_well_injection_m3_per_day = 300  # потолок одной нагнетательной
#   max_field_liquid_m3_per_year = 4e6   # годовой объём отбора по объекту
#   max_field_liquid_m3_total = 6e7      # то же за весь горизонт разработки
#   max_field_injection_m3_total = 8e7
#   max_watercut = 0.95                  # предел обводнённости (проверка по выгрузке)
#   max_field_injection_m3_per_year = 6e6
#   max_field_oil_t_per_day = 1200       # мощность УПН: предел по нефти
#   max_field_water_t_per_day = 9000     # мощность УПСВ: предел по попутной воде
#   water_tolerance_min = 0.85           # нижняя граница коридора баланса воды
#   min_reservoir_pressure_atm = 50      # пластовое давление: проверка по факту
#   max_reservoir_pressure_atm = 300
#   field_limits_are_annual_average = true  # суточные пределы — среднее за год,
#                                           # а не пик каждого месяца
#
# Фонд и мероприятия:
#   controllable_wells = ["102", "305"]  # остальные остаются на историческом режиме
#   forced_shut_wells = ["417"]          # остановлены на весь горизонт
#   max_active_wells = 90
#   max_events_per_year = 12             # остановки, пуски, переводы под закачку
#   max_events_per_month = 3             # тот же счёт, но за календарный месяц
#   min_regime_months = 3                # режим скважины держится не меньше трёх месяцев
#   min_producer_rate_m3_per_day = 5     # ниже порога скважина не работает, а стоит
#
# Адресные потолки и группы:
#   [limits.well_caps_m3_per_day]
#   "102" = 250
#
#   [limits.well_groups]
#   "куст-1" = ["102", "305"]            # скважина может входить в несколько групп
#
#   [limits.group_liquid_caps_m3_per_day]
#   "куст-1" = 400
#
#   [limits.group_injection_caps_m3_per_day]
#   "куст-1" = 300
#
# Обязательные остановки с окном дат (окон у скважины может быть несколько):
#   [[limits.forced_shut_windows]]
#   well = "102"
#   start = 2027-01-01
#   end = 2027-06-30

[policy]
# Сколько убыточных месяцев подряд считать основанием для остановки скважины.
lookback_months = 6

[trust]
# Пары должны быть кандидатами того же поиска, к которому применяется запас.
pairs_file = "docs/data/margin-pairs-search.csv"
pairs_family = "search"
# Ночной набор: порядок координат поиска. Каждый seed даёт отдельный кандидат,
# который обязательно проходит полный ГГДМ-расчёт.
# Десять, а не шесть: конформный индекс ⌈(n+1)·(1−α)⌉ при α = 0,1 равен n вплоть
# до n = 18, то есть до 19 пар запас — это просто худшая наблюдённая ошибка.
# Девять пар уже есть, десять новых дают 19 — первое n, где берётся 18-й остаток
# из 19, а не максимум.
search_seeds = [20260830, 20260831, 20260901, 20260902, 20260903, 20260904,
                20260905, 20260906, 20260907, 20260908]

[explain]
# Слой интерпретируемости. Требование ТЗ п. 3.1: языковая модель в ядре слоя.
# Модель формулирует объяснение, но не принимает решений и не производит чисел —
# все величины приходят из расчёта и проверяются в тексте (aios/explain.py).

# Выключен по умолчанию: проверяющий запускает пакет без наших учётных данных,
# и объяснения тогда идут по шаблону, а не роняют прогон.
enabled = false

# Поставщик модели: anthropic или yandex. Слой написан под контракт Anthropic,
# адаптер Яндекса живёт отдельно (aios/yandex.py) и зависимостей не добавляет.
provider = "yandex"

# Каталог Yandex Cloud. Не секрет — секрет только ключ, и он читается ИСКЛЮЧИТЕЛЬНО
# из переменной окружения YANDEX_API_KEY. В конфиге ключу места нет: конфиг едет
# в git, а ключ ехать туда не должен.
folder_id = "b1gv1qukvdoctt94dgnu"

# Имя модели. Для anthropic — claude-opus-5; для yandex — yandexgpt/latest либо
# готовый URI вида gpt://<каталог>/<модель>.
model = "yandexgpt/latest"
max_tokens = 1024

# Объяснение готового решения — не та задача, где нужна глубина рассуждения.
effort = "low"

# Детерминизма у вызова нет: на claude-opus-5 параметр temperature не
# принимается вовсе. Воспроизводимость даёт кэш — объяснение сохраняется по
# отпечатку набора фактов, и повторный прогон берёт готовый текст.
cache_dir = "artifacts/explanations"

[run]
# Любая случайность в проекте берётся отсюда: регламент прямо запрещает
# неконтролируемые случайные параметры.
seed = 20260817
processes = 2
